name: "Terraform action"

on:
  push:
    branches:
      - main
      - geemanthi-github-branch
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform.yml"
permissions:
      id-token: write # This is required for aws oidc connection
      contents: read # This is required for actions/checkout
      pull-requests: write # This is required for gh bot to comment PR

env:
  TF_LOG: ERROR
  TF_WORKING_DIR: infrastructure
  AWS_TFSTATE_BUCKET: ${{ secrets.AWS_TFSTATE_BUCKET }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  PRODUCT: testing
  SERVICE: infrastructure-core
  ENVIRONMENT: dev

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infrastructure
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${AWS_ROLE_ARN }
          aws-region: ${AWS_DEFAULT_REGION}
          role-session-name: github-actions-terraform
     
      - name: Sts GetCallerIdentity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform init -backend-config="bucket=${AWS_TFSTATE_BUCKET}" -backend-config="key=$PRODUCT/$SERVICE/${{ env.ENVIRONMENT }}/terraform.tfstate" -backend-config="region=${AWS_DEFAULT_REGION}"
          terraform plan -var-file=${{ env.ENVIRONMENT }}.tfvars -var "env=${{ env.ENVIRONMENT }}" -out=${{ env.ENVIRONMENT }}.tfplan

      # - uses: actions/github-script@v6
